<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel da rede</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#F2CC7A}a:hover{color:#FFE2A3}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 400px; height: 1240px; box-sizing: border-box; padding: 18px 16px 14px; background: #13100C; border-radius: 16px; border: 1px solid rgba(255,255,255,0.10); color: #F5F5F5; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; gap: 14px;">

  <div style="display: flex; align-items: center; gap: 12px;">
    <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(#F2CC7A, #BD8A33); display: flex; align-items: center; justify-content: center; color: #1F1505; flex-shrink: 0;">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 9a14 14 0 0 1 19 0M5.5 12.5a9.5 9.5 0 0 1 13 0M8.5 16a5 5 0 0 1 7 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"></path><circle cx="12" cy="19.2" r="1.4" fill="currentColor"></circle></svg>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 17px; font-weight: 700;">Rede</div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255,255,255,0.62);"><span style="width: 7px; height: 7px; border-radius: 50%; background: #5BD27A;"></span>Wi-Fi [NOME DA REDE] · 5 GHz</div>
    </div>
    <button aria-label="Preferências da rede" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.3" fill="none" stroke="currentColor" stroke-width="1.4"></circle><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg>
    </button>
  </div>

  <div style="display: flex; flex-direction: column; gap: 10px; padding: 16px; border-radius: 14px; background: rgba(255,255,255,0.06);">
    <div style="display: flex; align-items: flex-end; justify-content: space-between;">
      <div style="display: flex; flex-direction: column; gap: 4px;">
        <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.6);">Latência · até 1.1.1.1</div>
        <div style="display: flex; align-items: baseline; gap: 4px; font-variant-numeric: tabular-nums;">
          <span style="font-size: 46px; font-weight: 700; letter-spacing: -0.03em; color: #F2CC7A;">6</span>
          <span style="font-size: 20px; font-weight: 600; color: rgba(255,255,255,0.75);">ms</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; align-items: flex-end; gap: 2px; font-size: 13px; color: rgba(255,255,255,0.7); font-variant-numeric: tabular-nums; padding-bottom: 6px;">
        <span>variação 1 ms</span><span>perda 0%</span>
      </div>
    </div>
    <div style="height: 56px; display: flex; align-items: flex-end; gap: 3px;">
      <sc-for list="{{ping}}" as="h" hint-placeholder-count="40">
        <span style="{{h}}"></span>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 11px; color: rgba(255,255,255,0.55);"><span>há 2 min</span><span>um pico de 84 ms às 14:58</span><span>agora</span></div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.06);">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.62);"><span style="width: 8px; height: 8px; border-radius: 2px; background: #E0B357;"></span>Baixando</span>
      <span style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums;">12,4 MB/s</span>
      <span style="font-size: 12px; color: rgba(255,255,255,0.62);">hoje 8,2 GB</span>
    </div>
    <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.06);">
      <span style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,0.62);"><span style="width: 8px; height: 8px; border-radius: 2px; background: rgba(255,255,255,0.5);"></span>Enviando</span>
      <span style="font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums;">820 KB/s</span>
      <span style="font-size: 12px; color: rgba(255,255,255,0.62);">hoje 1,1 GB</span>
    </div>
  </div>
  <div style="display: flex; flex-direction: column; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.06);">
    <div style="height: 50px; display: flex; align-items: flex-end; gap: 3px;">
      <sc-for list="{{baixa}}" as="h" hint-placeholder-count="30">
        <span style="{{h}}"></span>
      </sc-for>
    </div>
    <div style="height: 1px; background: rgba(255,255,255,0.18);"></div>
    <div style="height: 26px; display: flex; align-items: flex-start; gap: 3px;">
      <sc-for list="{{sobe}}" as="h" hint-placeholder-count="30">
        <span style="{{h}}"></span>
      </sc-for>
    </div>
  </div>

  <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.62); margin-top: 2px;">Conexão</div>
  <div style="display: flex; flex-direction: column; padding: 4px 12px; border-radius: 12px; background: rgba(255,255,255,0.06);">
    <sc-for list="{{linhas}}" as="l" hint-placeholder-count="6">
      <div style="display: flex; justify-content: space-between; align-items: center; padding: 7px 0; font-size: 14px;">
        <span style="color: rgba(255,255,255,0.68);">{{l.r}}</span>
        <span style="font-variant-numeric: tabular-nums;">{{l.v}}</span>
      </div>
    </sc-for>
    <div style="display: flex; justify-content: space-between; align-items: center; padding: 7px 0; font-size: 14px;">
      <span style="color: rgba(255,255,255,0.68);">IP público</span>
      <button style="border: none; background: rgba(255,255,255,0.08); color: #F2CC7A; font-size: 13px; font-weight: 600; padding: 4px 10px; border-radius: 10px;">Mostrar</button>
    </div>
  </div>

  <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 2px;">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.62);">Quem mais usa</span>
    <span style="font-size: 12px; color: rgba(255,255,255,0.55);">↓ · ↑</span>
  </div>
  <div style="display: flex; flex-direction: column; padding: 4px 12px; border-radius: 12px; background: rgba(255,255,255,0.06);">
    <sc-for list="{{apps}}" as="a" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 10px; padding: 8px 0;">
        <span style="{{a.icone}}">{{a.letra}}</span>
        <span style="flex: 1; font-size: 14px;">{{a.nome}}</span>
        <span style="font-size: 13px; font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.8);">{{a.valor}}</span>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
    <button style="height: 40px; border-radius: 20px; border: none; background: linear-gradient(#F2CC7A, #BD8A33); color: #1F1505; font-size: 15px; font-weight: 700; box-shadow: 0 2px 10px rgba(224,179,87,0.35);">Abrir ajustes de Rede</button>
    <div style="display: flex; justify-content: space-between; font-size: 15px; color: rgba(255,255,255,0.75); padding: 0 6px;"><span>Visão geral</span><span>Sair</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const pv = [7, 6, 6, 8, 6, 5, 6, 7, 6, 6, 9, 6, 5, 6, 84, 22, 8, 6, 6, 7, 6, 5, 6, 6, 7, 6, 6, 8, 6, 5, 6, 7, 6, 6, 5, 6, 7, 6, 6, 6];
    const ping = pv.map((v) => 'flex: 1; border-radius: 1.5px 1.5px 0 0; height: ' + Math.min(56, Math.max(4, Math.round(v * 0.9 + 4))) + 'px; background: ' + (v >= 60 ? '#F2CC7A' : '#5BD27A') + '; opacity: 0.9;');
    const bv = [10, 12, 8, 30, 60, 85, 70, 40, 22, 18, 20, 26, 34, 50, 62, 58, 44, 30, 24, 20, 18, 22, 28, 36, 42, 48, 52, 50, 46, 44];
    const sv = [2, 2, 3, 4, 6, 8, 5, 3, 2, 2, 3, 4, 6, 9, 12, 10, 6, 4, 3, 3, 2, 3, 4, 5, 6, 7, 6, 5, 5, 4];
    const baixa = bv.map((v, i) => 'flex: 1; border-radius: 2px 2px 0 0; height: ' + Math.max(1, Math.round(v * 0.5)) + 'px; background: #E0B357; opacity: ' + (i >= 26 ? 1 : 0.65) + ';');
    const sobe = sv.map((v) => 'flex: 1; border-radius: 0 0 2px 2px; height: ' + Math.max(1, Math.round(v * 2)) + 'px; background: rgba(255,255,255,0.5);');
    const linhas = [
      { r: 'Sinal', v: '−52 dBm · ótimo' },
      { r: 'Canal', v: '149 · 80 MHz · Wi-Fi 6E' },
      { r: 'Velocidade do link', v: '1.200 Mbit/s' },
      { r: 'IP local', v: '192.168.0.12' },
      { r: 'Roteador', v: '192.168.0.1 · 2 ms' },
      { r: 'DNS', v: '1.1.1.1' }
    ];
    const icone = (cor) => 'width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #1F1505; background: ' + cor + ';';
    const apps = [
      { letra: 'G', nome: 'Google Chrome', valor: '9,8 MB/s · 210 KB/s', icone: icone('#E8A07C') },
      { letra: 'D', nome: 'Dropbox', valor: '2,1 MB/s · 540 KB/s', icone: icone('#9CC3F5') },
      { letra: 'C', nome: 'Claude', valor: '120 KB/s · 40 KB/s', icone: icone('#D9D4CA') }
    ];
    return { ping, baixa, sobe, linhas, apps };
  }
}
</script>
</body>
</html>
