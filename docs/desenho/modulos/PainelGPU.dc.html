<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Painel da GPU</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#F2CC7A}a:hover{color:#FFE2A3}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 400px; height: 1240px; box-sizing: border-box; padding: 18px 16px 14px; background: #13100C; border-radius: 16px; border: 1px solid rgba(255,255,255,0.10); color: #F5F5F5; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; gap: 14px;">

  <div style="display: flex; align-items: center; gap: 12px;">
    <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(#F2CC7A, #BD8A33); display: flex; align-items: center; justify-content: center; color: #1F1505; flex-shrink: 0;">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M3 7h18v10H3zM7 17v3M17 17v3M14 10h4M14 14h4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="8.5" cy="12" r="2" fill="none" stroke="currentColor" stroke-width="2"></circle></svg>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 17px; font-weight: 700;">GPU</div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255,255,255,0.62);"><span style="width: 7px; height: 7px; border-radius: 50%; background: #5BD27A;"></span>Integrada · 2 telas</div>
    </div>
    <button aria-label="Preferências da GPU" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.3" fill="none" stroke="currentColor" stroke-width="1.4"></circle><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg>
    </button>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 16px; border-radius: 14px; background: rgba(255,255,255,0.06);">
    <div style="flex: 1; display: flex; flex-direction: column; gap: 4px;">
      <div style="font-size: 11px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.6);">Uso · média de 5 s</div>
      <div style="display: flex; align-items: baseline; gap: 4px; font-variant-numeric: tabular-nums;">
        <span style="font-size: 46px; font-weight: 700; letter-spacing: -0.03em; color: #F2CC7A;">53</span>
        <span style="font-size: 20px; font-weight: 600; color: rgba(255,255,255,0.75);">%</span>
      </div>
      <div style="font-size: 13px; color: rgba(255,255,255,0.62); font-variant-numeric: tabular-nums;">Pico de 78% há 4 min</div>
    </div>
    <div style="position: relative; width: 92px; height: 92px; flex-shrink: 0;">
      <svg width="92" height="92" viewBox="0 0 96 96" aria-hidden="true"><circle cx="48" cy="48" r="40" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="8"></circle><circle cx="48" cy="48" r="40" fill="none" stroke="#E0B357" stroke-width="8" stroke-linecap="round" stroke-dasharray="133.2 251.3" transform="rotate(-90 48 48)"></circle></svg>
      <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; font-variant-numeric: tabular-nums;">
        <span style="font-size: 21px; font-weight: 700;">63°</span>
        <span style="font-size: 11px; color: rgba(255,255,255,0.62);">GPU</span>
      </div>
    </div>
  </div>

  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px;">
    <sc-for list="{{blocos}}" as="b" hint-placeholder-count="3">
      <div style="display: flex; flex-direction: column; gap: 4px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.06);">
        <span style="font-size: 12px; color: rgba(255,255,255,0.62);">{{b.r}}</span>
        <span style="font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums;">{{b.v}}</span>
        <span style="font-size: 12px; color: rgba(255,255,255,0.62);">{{b.s}}</span>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 6px;">
    <sc-for list="{{periodos}}" as="p" hint-placeholder-count="4">
      <span style="{{p.estilo}}">{{p.nome}}</span>
    </sc-for>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.06);">
    <div style="height: 90px; display: flex; align-items: flex-end; gap: 3px;">
      <sc-for list="{{historico}}" as="h" hint-placeholder-count="30">
        <span style="{{h}}"></span>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; font-size: 11px; color: rgba(255,255,255,0.55);"><span>14:50</span><span>14:55</span><span>agora</span></div>
  </div>

  <div style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.62); margin-top: 2px;">Motores de vídeo</div>
  <div style="display: flex; flex-direction: column; gap: 10px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.06);">
    <sc-for list="{{motores}}" as="m" hint-placeholder-count="2">
      <div style="display: flex; flex-direction: column; gap: 5px;">
        <div style="display: flex; justify-content: space-between; font-size: 14px;"><span style="color: rgba(255,255,255,0.68);">{{m.r}}</span><span style="font-variant-numeric: tabular-nums;">{{m.v}}</span></div>
        <div style="height: 4px; border-radius: 2px; background: rgba(255,255,255,0.08);"><div style="{{m.barra}}"></div></div>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 2px;">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.62);">Quem mais usa</span>
    <span style="font-size: 12px; color: rgba(255,255,255,0.55);">tempo de GPU</span>
  </div>
  <div style="display: flex; flex-direction: column; padding: 4px 12px; border-radius: 12px; background: rgba(255,255,255,0.06);">
    <sc-for list="{{apps}}" as="a" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 10px; padding: 8px 0;">
        <span style="{{a.icone}}">{{a.letra}}</span>
        <span style="flex: 1; font-size: 14px;">{{a.nome}}</span>
        <span style="font-size: 14px; font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.8);">{{a.valor}}</span>
      </div>
    </sc-for>
  </div>

  <div style="display: flex; flex-direction: column; padding: 4px 12px; border-radius: 12px; background: rgba(255,255,255,0.06);">
    <sc-for list="{{linhas}}" as="l" hint-placeholder-count="3">
      <div style="display: flex; justify-content: space-between; padding: 7px 0; font-size: 14px;">
        <span style="color: rgba(255,255,255,0.68);">{{l.r}}</span>
        <span style="font-variant-numeric: tabular-nums;">{{l.v}}</span>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
    <button style="height: 40px; border-radius: 20px; border: none; background: linear-gradient(#F2CC7A, #BD8A33); color: #1F1505; font-size: 15px; font-weight: 700; box-shadow: 0 2px 10px rgba(224,179,87,0.35);">Abrir Monitor de Atividade</button>
    <div style="display: flex; justify-content: space-between; font-size: 15px; color: rgba(255,255,255,0.75); padding: 0 6px;"><span>Visão geral</span><span>Sair</span></div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":1240}}'>
class Component extends DCLogic {
  renderVals() {
    const chip = 'height: 26px; padding: 0 11px; border-radius: 13px; font-size: 13px; font-weight: 600; display: flex; align-items: center; ';
    const periodos = ['1 min', '10 min', '1 h', '24 h'].map((nome, i) => ({ nome,
      estilo: chip + (i === 1 ? 'background: linear-gradient(#F2CC7A, #BD8A33); color: #1F1505; box-shadow: 0 2px 10px rgba(224,179,87,0.35);' : 'background: rgba(255,255,255,0.06); color: rgba(255,255,255,0.66);') }));
    const vals = [18, 20, 22, 30, 42, 55, 66, 72, 78, 70, 62, 58, 52, 48, 50, 55, 60, 57, 52, 49, 51, 54, 50, 48, 52, 55, 53, 51, 54, 53];
    const historico = vals.map((v, i) => 'flex: 1; border-radius: 2px 2px 0 0; height: ' + Math.round(v * 0.9) + 'px; background: #E0B357; opacity: ' + (i >= 26 ? 1 : 0.6) + ';');
    const blocos = [
      { r: 'Potência', v: '21 W', s: 'de 60 W' },
      { r: 'Memória', v: '9,8 GB', s: 'em uso pela GPU' },
      { r: 'Frequência', v: '1,18 GHz', s: '82% do máx.' }
    ];
    const barra = (p) => 'width: ' + p + '%; height: 4px; border-radius: 2px; background: #E0B357;';
    const motores = [
      { r: 'Codificar vídeo', v: '30%', barra: barra(30) },
      { r: 'Decodificar vídeo', v: '4%', barra: barra(4) }
    ];
    const icone = (cor) => 'width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #1F1505; background: ' + cor + ';';
    const apps = [
      { letra: 'F', nome: 'Final Cut Pro', valor: '31%', icone: icone('#A9A6F2') },
      { letra: 'W', nome: 'WindowServer', valor: '14%', icone: icone('#D9D4CA') },
      { letra: 'G', nome: 'Google Chrome', valor: '6%', icone: icone('#E8A07C') }
    ];
    const linhas = [
      { r: 'Núcleos gráficos', v: '40' },
      { r: 'Telas', v: 'Integrada 120 Hz · Externa 60 Hz' },
      { r: 'Temperatura', v: '63 °C' }
    ];
    return { periodos, historico, blocos, motores, apps, linhas };
  }
}
</script>
</body>
</html>
