<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Visão geral</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<style>
body{margin:0}
a{color:#F2CC7A}a:hover{color:#FFE2A3}
button{font-family:inherit;cursor:pointer}
</style>
</helmet>
<div style="width: 400px; height: 1060px; box-sizing: border-box; padding: 18px 16px 14px; background: #13100C; border-radius: 16px; border: 1px solid rgba(255,255,255,0.10); color: #F5F5F5; font-family: -apple-system, BlinkMacSystemFont, 'SF Pro Text', 'Helvetica Neue', sans-serif; display: flex; flex-direction: column; gap: 14px;">

  <div style="display: flex; align-items: center; gap: 12px;">
    <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(#F2CC7A, #BD8A33); display: flex; align-items: center; justify-content: center; color: #1F1505; flex-shrink: 0;">
      <svg width="26" height="26" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"></path></svg>
    </div>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
      <div style="font-size: 17px; font-weight: 700;">Visão geral</div>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 13px; color: rgba(255,255,255,0.62);"><span style="width: 7px; height: 7px; border-radius: 50%; background: #F2CC7A;"></span>CPU puxada · ligado há 3 dias</div>
    </div>
    <button aria-label="Preferências" style="width: 32px; height: 32px; border-radius: 16px; border: none; background: rgba(255,255,255,0.07); color: rgba(255,255,255,0.8); display: flex; align-items: center; justify-content: center;">
      <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="2.3" fill="none" stroke="currentColor" stroke-width="1.4"></circle><path d="M8 1.5v1.8M8 12.7v1.8M1.5 8h1.8M12.7 8h1.8M3.4 3.4l1.3 1.3M11.3 11.3l1.3 1.3M3.4 12.6l1.3-1.3M11.3 4.7l1.3-1.3" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"></path></svg>
    </button>
  </div>

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px;">
    <sc-for list="{{blocos}}" as="b" hint-placeholder-count="6">
      <a href="{{b.link}}" style="text-decoration: none; color: inherit; display: flex; flex-direction: column; gap: 6px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.06); min-height: 132px; box-sizing: border-box;">
        <div style="display: flex; align-items: center; justify-content: space-between;">
          <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.62);">{{b.nome}}</span>
          <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
        </div>
        <span style="{{b.valorEstilo}}">{{b.valor}}</span>
        <span style="font-size: 12px; color: rgba(255,255,255,0.62); font-variant-numeric: tabular-nums;">{{b.sub}}</span>
        <div style="margin-top: auto; height: 22px; display: flex; align-items: flex-end; gap: 2px;">
          <sc-for list="{{b.barras}}" as="x" hint-placeholder-count="16">
            <span style="{{x}}"></span>
          </sc-for>
        </div>
      </a>
    </sc-for>
  </div>

  <div style="display: flex; align-items: center; gap: 12px; padding: 12px; border-radius: 12px; background: rgba(255,255,255,0.06);">
    <svg width="44" height="44" viewBox="0 0 44 44" aria-hidden="true"><circle cx="22" cy="22" r="18" fill="none" stroke="rgba(255,255,255,0.10)" stroke-width="5"></circle><circle cx="22" cy="22" r="18" fill="none" stroke="#E0B357" stroke-width="5" stroke-linecap="round" stroke-dasharray="90.5 113.1" transform="rotate(-90 22 22)"></circle></svg>
    <div style="flex: 1; display: flex; flex-direction: column; gap: 2px;">
      <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: rgba(255,255,255,0.62);">Bateria</span>
      <span style="font-size: 18px; font-weight: 700; font-variant-numeric: tabular-nums;">80% · 0 %/h</span>
      <span style="font-size: 12px; color: rgba(255,255,255,0.62);">Na tomada · segurando em 80%</span>
    </div>
    <svg width="12" height="12" viewBox="0 0 12 12" aria-hidden="true"><path d="M4.5 2.5 8 6l-3.5 3.5" fill="none" stroke="rgba(255,255,255,0.45)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"></path></svg>
  </div>

  <div style="display: flex; align-items: baseline; justify-content: space-between; margin-top: 2px;">
    <span style="font-size: 12px; font-weight: 600; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.62);">Quem mais pesa agora</span>
    <span style="font-size: 12px; color: rgba(255,255,255,0.55);">CPU · memória</span>
  </div>
  <div style="display: flex; flex-direction: column; padding: 4px 12px; border-radius: 12px; background: rgba(255,255,255,0.06);">
    <sc-for list="{{apps}}" as="a" hint-placeholder-count="3">
      <div style="display: flex; align-items: center; gap: 10px; padding: 8px 0;">
        <span style="{{a.icone}}">{{a.letra}}</span>
        <span style="flex: 1; font-size: 14px;">{{a.nome}}</span>
        <span style="font-size: 14px; font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.8);">{{a.cpu}}</span>
        <span style="width: 64px; text-align: right; font-size: 14px; font-variant-numeric: tabular-nums; color: rgba(255,255,255,0.62);">{{a.mem}}</span>
      </div>
    </sc-for>
  </div>

  <div style="margin-top: auto; display: flex; flex-direction: column; gap: 10px;">
    <button style="height: 40px; border-radius: 20px; border: none; background: linear-gradient(#F2CC7A, #BD8A33); color: #1F1505; font-size: 15px; font-weight: 700; box-shadow: 0 2px 10px rgba(224,179,87,0.35);">Abrir Monitor de Atividade</button>
    <div style="display: flex; justify-content: space-between; font-size: 15px; color: rgba(255,255,255,0.75); padding: 0 6px;">
      <span>Preferências…</span><span>Sair</span>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":400,"height":1060}}'>
class Component extends DCLogic {
  renderVals() {
    const barras = (vals, cor) => vals.map((v, i) => 'flex: 1; border-radius: 1.5px; height: ' + Math.max(2, Math.round(v / 100 * 22)) + 'px; background: ' + cor + '; opacity: ' + (i >= vals.length - 4 ? 1 : 0.5) + ';');
    const grande = 'font-size: 26px; font-weight: 700; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; ';
    const blocos = [
      { nome: 'CPU', link: 'PainelCPU.dc.html', valor: '83%', valorEstilo: grande + 'color: #F2CC7A;', sub: 'usuário 61 · sistema 22', barras: barras([40, 52, 48, 60, 66, 62, 70, 74, 78, 72, 80, 85, 82, 84, 81, 83], '#E0B357') },
      { nome: 'GPU', link: 'PainelGPU.dc.html', valor: '53%', valorEstilo: grande, sub: '21 W · 63 °C', barras: barras([20, 24, 30, 42, 55, 58, 50, 46, 52, 55, 49, 50, 54, 51, 52, 53], '#E0B357') },
      { nome: 'Memória', link: 'PainelMemoria.dc.html', valor: '50%', valorEstilo: grande, sub: '24 de 48 GB · pressão normal', barras: barras([46, 47, 47, 48, 48, 49, 49, 50, 50, 50, 49, 50, 50, 51, 50, 50], '#E0B357') },
      { nome: 'Disco', link: 'PainelDisco.dc.html', valor: '44%', valorEstilo: grande, sub: '↓ 120 MB/s · ↑ 8 MB/s', barras: barras([4, 6, 50, 88, 40, 12, 6, 4, 18, 46, 14, 8, 6, 30, 70, 35], '#E0B357') },
      { nome: 'Rede', link: 'PainelRede.dc.html', valor: '6 ms', valorEstilo: grande, sub: '↓ 12,4 MB/s · ↑ 820 KB/s', barras: barras([30, 28, 26, 40, 22, 20, 24, 26, 90, 30, 22, 24, 26, 25, 24, 22], '#E0B357') },
      { nome: 'Sensores', link: 'PainelSensores.dc.html', valor: '91 °C', valorEstilo: grande + 'color: #F2CC7A;', sub: 'CPU · sistema puxando 100 W', barras: barras([70, 72, 75, 80, 84, 88, 90, 92, 91, 90, 91, 92, 91, 90, 91, 91], '#E0B357') }
    ];
    const icone = (cor) => 'width: 24px; height: 24px; border-radius: 6px; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700; color: #1F1505; background: ' + cor + ';';
    const apps = [
      { letra: 'X', nome: 'Xcode', cpu: '212%', mem: '6,1 GB', icone: icone('#9CC3F5') },
      { letra: 'G', nome: 'Google Chrome', cpu: '64%', mem: '4,8 GB', icone: icone('#E8A07C') },
      { letra: 'C', nome: 'Claude', cpu: '18%', mem: '1,2 GB', icone: icone('#D9D4CA') }
    ];
    return { blocos, apps };
  }
}
</script>
</body>
</html>
